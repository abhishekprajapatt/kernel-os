name: Update Star History

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Star History
        uses: xpzouying/star-history@v1
        with:
          repo: abhishekprajapatt/kernel-os
          out-light: assets/star-history/star-history.svg
          out-dark: assets/star-history/star-history-dark.svg
